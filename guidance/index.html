<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart City Parking Guidance System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
    }
    .container-box {
      max-width: 950px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .header {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      padding: 18px 24px;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .content-area {
      display: flex;
      gap: 24px;
      padding: 24px;
    }
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bay-card {
      background: #090d16;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bay-name {
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
    }
    .bay-status-badge {
      font-family: 'Courier New', monospace;
      font-size: 42px;
      font-weight: 900;
      padding: 8px 24px;
      border-radius: 6px;
      border: 2px solid #475569;
      background: #000;
      letter-spacing: 2px;
    }
    .text-green { color: #22c55e; border-color: #15803d; }
    .text-red { color: #ef4444; border-color: #b91c1c; }

    .right-panel {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .gauge-card {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .metric-box {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .metric-title { font-size: 14px; color: #94a3b8; margin-bottom: 6px; }
    .metric-val {
      font-family: 'Courier New', monospace;
      font-size: 36px;
      font-weight: 700;
      color: #38bdf8;
    }
    @media (max-width: 768px) {
      .content-area { flex-direction: column; }
      .right-panel { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container-box">
    <div class="header">
      <div><i class="bi bi-geo-alt-fill me-2"></i>Smart City: ระบบนำทางที่จอดรถอัจฉริยะ (Rest Area)</div>
      <div id="live-indicator" class="badge bg-success"><i class="bi bi-broadcast me-1"></i>LIVE</div>
    </div>

    <div class="content-area">
      <!-- ฝั่งซ้าย: ป้ายแสดงลานจอดจำลอง -->
      <div class="left-panel">
        <div class="bay-card">
          <div>
            <div class="bay-name">ลานจอด 1 (จุดพักรถบางปะกง)</div>
            <div class="text-secondary small mt-1">ความจุสูงสุด: <span id="total-capacity">8</span> ช่อง</div>
          </div>
          <div id="bay-led" class="bay-status-badge text-green">8</div>
        </div>

        <div class="bay-card" style="opacity: 0.5;">
          <div>
            <div class="bay-name">ลานจอด 2 (โซนสถานีชาร์จ EV)</div>
            <div class="text-secondary small mt-1">รองรับการต่อขยายในอนาคต</div>
          </div>
          <div class="bay-status-badge text-secondary">READY</div>
        </div>
      </div>

      <!-- ฝั่งขวา: สถิติและเกจ -->
      <div class="right-panel">
        <div class="gauge-card">
          <canvas id="gauge" style="max-height: 180px;"></canvas>
          <div class="small text-secondary mt-2">อัตราส่วนการเข้าจอด</div>
        </div>

        <div class="metric-box">
          <div class="metric-title">ช่องจอดว่างทั้งหมด</div>
          <div class="metric-val text-green" id="val-available">8</div>
        </div>

        <div class="metric-box">
          <div class="metric-title">รถเข้าจอดแล้ว</div>
          <div class="metric-val text-red" id="val-parked">0</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL Web App จาก Google Apps Script (ลงท้ายด้วย /exec)
    const API_URL = "https://script.google.com/macros/s/AKfycbzkGglMWJAnvbjXmdD76vRydjr7f1pQEttifQQ3ItVb42b96XoBfOG7DmGBBVlDN5DQGQ/exec?action=get_status";

    const ctx = document.getElementById('gauge').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['จอดแล้ว', 'ว่าง'],
        datasets: [{
          data: [0, 8],
          backgroundColor: ['#ef4444', '#22c55e'],
          borderWidth: 0
        }]
      },
      options: {
        cutout: '70%',
        rotation: 270,
        circumference: 180,
        plugins: { legend: { display: false } }
      }
    });

    async function fetchParkingStatus() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        if (data.status === "success") {
          const total = data.total;
          const avail = data.available;
          const occupied = data.occupied;

          document.getElementById('total-capacity').textContent = total;
          document.getElementById('val-available').textContent = avail;
          document.getElementById('val-parked').textContent = occupied;

          const led = document.getElementById('bay-led');
          if (avail === 0) {
            led.textContent = 'FULL';
            led.className = 'bay-status-badge text-red';
          } else {
            led.textContent = avail;
            led.className = 'bay-status-badge text-green';
          }

          chart.data.datasets[0].data = [occupied, avail];
          chart.update();
        }
      } catch (err) {
        console.error("Fetch Error:", err);
      }
    }

    // ดึงข้อมูลครั้งแรก และวนลูปอัปเดตทุก 3 วินาที
    fetchParkingStatus();
    setInterval(fetchParkingStatus, 3000);
  </script>
</body>
</html>
